<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Van LAN Router</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .card { margin-bottom: 20px; }
        .signal-icon { width: 24px; height: 24px; }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark bg-primary mb-4">
        <div class="container">
            <span class="navbar-brand mb-0 h1">Van LAN Dashboard</span>
        </div>
    </nav>

    <div class="container">
        <div class="row">
            <!-- Status Section -->
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">Local Access Point (Van LAN)</div>
                    <div id="ap-status" class="card-body">
                        Loading...
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">Internet Connection</div>
                    <div id="outbound-status" class="card-body">
                        Loading...
                    </div>
                </div>
            </div>
        </div>

        <!-- Scan Section -->
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                Available Networks
                <button id="refresh-btn" class="btn btn-sm btn-outline-primary">Scan</button>
            </div>
            <div class="card-body">
                <ul id="network-list" class="list-group list-group-flush">
                    <li class="list-group-item">Click 'Scan' to find networks...</li>
                </ul>
            </div>
        </div>
    </div>

    <!-- Connect Modal -->
    <div class="modal fade" id="connectModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Connect to <span id="modal-ssid"></span></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="password" id="wifi-password" class="form-control" placeholder="Password">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" id="connect-btn" class="btn btn-primary">Connect</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let selectedSSID = '';

        async function updateStatus() {
            const res = await fetch('/status');
            const data = await res.json();
            
            document.getElementById('ap-status').innerHTML = `
                <strong>SSID:</strong> ${data.ap.ssid}<br>
                <strong>Status:</strong> <span class="badge ${data.ap.active ? 'bg-success' : 'bg-danger'}">${data.ap.active ? 'Active' : 'Inactive'}</span>
            `;

            document.getElementById('outbound-status').innerHTML = `
                <strong>SSID:</strong> ${data.outbound.ssid}<br>
                <strong>Interface:</strong> ${data.outbound.interface}<br>
                <strong>Status:</strong> <span class="badge ${data.outbound.connected ? 'bg-success' : 'bg-danger'}">${data.outbound.connected ? 'Connected' : 'Disconnected'}</span>
            `;
        }

        async function scanNetworks() {
            const list = document.getElementById('network-list');
            list.innerHTML = '<li class="list-group-item text-center">Scanning...</li>';
            
            try {
                const res = await fetch('/scan');
                const data = await res.json();
                list.innerHTML = '';
                
                data.forEach(net => {
                    const li = document.createElement('li');
                    li.className = 'list-group-item d-flex justify-content-between align-items-center';
                    li.innerHTML = `
                        <div>
                            <strong>${net.ssid}</strong> <small class="text-muted">(${net.security})</small>
                        </div>
                        <div>
                            <span class="badge bg-secondary me-2">${net.signal}%</span>
                            <button class="btn btn-sm btn-primary" onclick="showConnect('${net.ssid}')">Connect</button>
                        </div>
                    `;
                    list.appendChild(li);
                });
            } catch (e) {
                list.innerHTML = '<li class="list-group-item text-danger">Scan failed</li>';
            }
        }

        const modal = new bootstrap.Modal(document.getElementById('connectModal'));

        function showConnect(ssid) {
            selectedSSID = ssid;
            document.getElementById('modal-ssid').innerText = ssid;
            document.getElementById('wifi-password').value = '';
            modal.show();
        }

        document.getElementById('connect-btn').onclick = async () => {
            const password = document.getElementById('wifi-password').value;
            document.getElementById('connect-btn').disabled = true;
            document.getElementById('connect-btn').innerText = 'Connecting...';

            const res = await fetch('/connect', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ssid: selectedSSID, password: password})
            });
            
            const result = await res.json();
            if (result.success) {
                modal.hide();
                updateStatus();
            } else {
                alert('Connection failed!');
            }
            
            document.getElementById('connect-btn').disabled = false;
            document.getElementById('connect-btn').innerText = 'Connect';
        };

        document.getElementById('refresh-btn').onclick = scanNetworks;

        updateStatus();
        setInterval(updateStatus, 5000);
    </script>
</body>
</html>
