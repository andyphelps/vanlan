<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Van LAN Router</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { width: 100%; max-width: 400px; padding: 20px; }
    </style>
</head>
<body>
    <div class="card login-card shadow">
        <div class="card-body">
            <h3 class="card-title text-center mb-4">Van LAN Login</h3>
            <div id="login-error" class="alert alert-danger d-none"></div>
            <div class="mb-3">
                <label for="password" class="form-label">Admin Password</label>
                <input type="password" id="password" class="form-control" autofocus>
            </div>
            <button id="login-btn" class="btn btn-primary w-100">Unlock Dashboard</button>
        </div>
    </div>

    <script>
        document.getElementById('login-btn').onclick = async () => {
            const password = document.getElementById('password').value;
            const res = await fetch('/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({password: password})
            });
            const data = await res.json();
            if (data.success) {
                window.location.reload();
            } else {
                const err = document.getElementById('login-error');
                err.innerText = data.message;
                err.classList.remove('d-none');
            }
        };

        document.getElementById('password').onkeypress = (e) => {
            if (e.key === 'Enter') document.getElementById('login-btn').click();
        };
    </script>
</body>
</html>
