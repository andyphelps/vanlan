# Force the NetworkManager-managed dnsmasq instance to read /etc/hosts
addn-hosts=/etc/hosts

# Explicitly map the short names for client discovery
address=/router/10.42.0.1
address=/router.phelps.van/10.42.0.1

# Tell clients this is the local search domain
domain=phelps.van
local=/phelps.van/
expand-hosts
